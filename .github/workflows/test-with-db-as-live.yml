name: Node.js CI with MariaDB

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # ⚠️ Keep this name fixed. Required status checks are configured per-organization
    # by check name, so renaming the job here silently exempts this repository
    # from the merge gate.
    name: CI Test

    # private repository: self-hosted
    # public repository: github-hosted
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted", "light"]' || '["ubuntu-latest"]') }}

    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.5.12
        ports:
          - 3306:3306
        env:
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: live
          MYSQL_ROOT_PASSWORD: password
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: 🛎️ Checkout repository code
        uses: actions/checkout@v7

      - name: 📍 Verify MariaDB connection / Create database / Set port
        env:
          PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"3306" --silent; do
            sleep 1
          done
          echo "CREATE DATABASE IF NOT EXISTS test;" > test.sql
          mysql -uroot -ppassword -h"127.0.0.1" -P"3306" < test.sql

      - name: 🏗️ Use Node.js
        uses: actions/setup-node@v7
        with:
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          # A floating LTS alias keeps every repository current without a scheduled
          # sweep to bump a pinned major across all of them. Pin a concrete version
          # here only in a repository that genuinely needs one.
          node-version: lts/*
          registry-url: https://npm.pkg.github.com

      - name: 🖨️ Print runtime versions
        run: |
          node -v
          npm -v

      - name: 📦 Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TO_REPO_OF_ORT_PRIVATE }}

      - name: 🧪 Jest
        run: echo "NODE_ENV=live" >> $GITHUB_ENV
      - run: npm run db:setup
      - run: npm run db:seed:master
      - run: npm run test:live --empty tests/empty/__tests__/
      - run: npm run test:live --empty tests/empty/_orders/
      - run: npm run db:seed:dev
      - run: npm run test:live --seeded tests/__tests__/
      - run: npm run test:live --seeded tests/_orders/
