name: Node.js CI with SQLite

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # ⚠️ Keep this name fixed. Required status checks are configured per-organization
    # by check name, so renaming the job here silently exempts this repository
    # from the merge gate.
    name: CI Test

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: 🛎️ Checkout repository code
        uses: actions/checkout@v7

      - name: 🏗️ Use Node.js
        uses: actions/setup-node@v7
        with:
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: false
          # A floating LTS alias keeps every repository current without a scheduled
          # sweep to bump a pinned major across all of them. Pin a concrete version
          # here only in a repository that genuinely needs one.
          node-version: lts/*

      - name: 🖨️ Print runtime versions
        run: |
          node -v
          npm -v

      - name: 📦 Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TO_REPO_OF_ORT_PRIVATE }}

      - name: 🧵 ESLint
        run: npm run lint

      - name: 🧪 Jest
        run: echo "NODE_ENV=development" >> $GITHUB_ENV
      - run: npm test --empty tests/empty/__tests__/
      - run: npm test --empty tests/empty/_orders/
      - run: npm test --seeded tests/__tests__/
      - run: npm test --seeded tests/_orders/
